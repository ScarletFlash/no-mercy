packages:
  - packages/*

catalogMode: strict

catalogs:
  codebase:
    '@changesets/changelog-github': ^0.7.0
    '@changesets/cli': ^2.31.0
    '@eslint/js': ^10.0.1
    '@pnpm/read-package-json': ^1000.1.8
    '@pnpm/types': ^1001.3.0
    cspell: ^10.0.0
    eslint: ^10.2.1
    eslint-doc-generator: ^3.3.2
    eslint-import-resolver-typescript: ^4.4.4
    eslint-plugin-functional: ^9.0.2
    eslint-plugin-import-x: ^4.16.2
    eslint-plugin-unicorn: ^64.0.0
    knip: ^6.7.0
    prettier: ^3.7.4
    prettier-plugin-sort-json: ^4.1.1
    typescript-eslint: ^8.59.1
  stack:
    '@rslib/core': ^0.21.0
    '@rstest/core': ^0.9.0
    '@types/node': ^24.0.0
    '@typescript-eslint/parser': ^8.59.1
    '@typescript-eslint/rule-tester': ^8.59.1
    '@typescript-eslint/utils': ^8.59.1
    'arkregex': ^0.0.5
    'change-case': ^5.4.4
    jiti: ^2.0.0
    tsx: ^4.22.3
    turbo: ^2.9.0
    typescript: ^6.0.0

autoInstallPeers: false

cleanupUnusedCatalogs: true

disallowWorkspaceCycles: true

managePackageManagerVersions: true

onlyBuiltDependencies:
  - core-js
  - cspell
  - esbuild
  - prettier
  - typescript
  - unrs-resolver

packageManagerStrict: true

preferFrozenLockfile: false

publicHoistPattern:
  - prettier-plugin-*
  - eslint-*

requiredScripts:
  - _check-all
  - _fix-all
  - compiler__check
  - formatter__check
  - formatter__fix
  - linter__check
  - linter__fix
  - spell-checker__check

strictDepBuilds: true

strictPeerDependencies: false

verifyDepsBeforeRun: warn
