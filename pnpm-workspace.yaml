packages:
  - packages/*

autoInstallPeers: false

catalogMode: strict

catalogs:
  codebase:
    '@changesets/changelog-github': ^1.0.1
    '@changesets/cli': ^3.0.3
    '@eslint/js': ^10.0.1
    '@pnpm/pkg-manifest.reader': ^1100.0.25
    '@pnpm/types': ^1102.1.4
    cspell: ^10.5.2
    eslint: ^10.2.1
    eslint-doc-generator: ^3.3.2
    eslint-import-resolver-typescript: ^4.4.4
    eslint-plugin-functional: ^9.0.2
    eslint-plugin-import-x: ^4.16.2
    eslint-plugin-unicorn: ^64.0.0
    knip: ^6.45.1
    prettier: ^3.10.1
    prettier-plugin-embed: ^0.8.2
    prettier-plugin-sort-json: ^4.2.0
    typescript-eslint: ^8.59.1
  stack:
    '@rslib/core': ^1.0.7
    '@rstest/core': ^0.12.6
    '@types/node': ^24.0.0
    '@typescript-eslint/parser': ^8.59.1
    '@typescript-eslint/rule-tester': ^8.59.1
    '@typescript-eslint/typescript-estree': ^8.59.1
    '@typescript-eslint/utils': ^8.59.1
    arkregex: ^0.0.14
    change-case: ^5.4.4
    compromise: ^14.20.0
    tsx: ^4.23.15
    turbo: ^2.11.12
    typescript: ^6.0.0

cleanupUnusedCatalogs: true

disallowWorkspaceCycles: true

managePackageManagerVersions: true

onlyBuiltDependencies:
  - core-js
  - cspell
  - esbuild
  - prettier
  - typescript
  - unrs-resolver

packageManagerStrict: true

preferFrozenLockfile: false

publicHoistPattern:
  - prettier-plugin-*
  - eslint-*

requiredScripts:
  - _check-all
  - _fix-all
  - compiler__check
  - formatter__check
  - formatter__fix
  - linter__check
  - linter__fix
  - spell-checker__check

strictDepBuilds: true

strictPeerDependencies: false

verifyDepsBeforeRun: warn
